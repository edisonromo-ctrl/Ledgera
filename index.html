<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#176b5f"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="logo.svg" type="image/svg+xml"><title>Hogar de Larry | Prestamos y abonos</title>
<style>
:root{--bg:#f6f3ee;--panel:#fff;--ink:#202124;--muted:#69716f;--line:#ddd7cc;--brand:#176b5f;--brand2:#0f4f47;--accent:#bf6f2d;--danger:#a93636}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,Helvetica,sans-serif}.app{width:min(1100px,calc(100% - 24px));margin:auto;padding:18px 0 28px}header{display:flex;gap:14px;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{display:flex;gap:12px;align-items:center}.brand img{width:64px;height:64px;border-radius:14px;background:#050504;object-fit:cover}.kicker{color:var(--brand);font-weight:800;font-size:.78rem;text-transform:uppercase;margin:0 0 3px}h1,h2,h3,p{margin:0}h1{font-size:clamp(1.35rem,4vw,2.2rem)}.muted{color:var(--muted);line-height:1.45}.grid{display:grid;grid-template-columns:360px 1fr;gap:14px}.panel,.card,.stat{background:var(--panel);border:1px solid var(--line);border-radius:8px}.panel{padding:14px}.actions,.tabs,.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 140px}button,label.button{border:0;border-radius:6px;min-height:40px;padding:9px 12px;background:var(--brand);color:#fff;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.secondary{background:#fff;color:var(--brand);border:1px solid var(--line)}.danger{background:#fff;color:var(--danger);border:1px solid #e4c9c9}.small{min-height:32px;padding:6px 9px;font-size:.86rem}.tab{background:#fff;color:var(--muted);border:1px solid var(--line);border-radius:999px}.tab.active{background:var(--brand);color:#fff;border-color:var(--brand)}label.field{display:grid;gap:6px;color:var(--muted);font-size:.86rem;font-weight:700}input,textarea{width:100%;border:1px solid var(--line);border-radius:6px;padding:10px 11px;font:inherit}textarea{min-height:82px;resize:vertical}form{display:grid;gap:10px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}.stat{padding:10px}.stat span{color:var(--muted);font-size:.76rem;font-weight:700}.stat strong{display:block;margin-top:5px;overflow-wrap:anywhere}.list{display:grid;gap:9px;margin-top:12px}.card{padding:11px;display:grid;gap:8px;cursor:pointer}.card.active{border-color:var(--brand);box-shadow:0 0 0 3px rgba(23,107,95,.13)}.card-head,.detail-head{display:flex;justify-content:space-between;gap:8px;align-items:start}.pill{border-radius:999px;padding:5px 8px;background:#e7f3ef;color:var(--brand2);font-size:.75rem;font-weight:700}.pill.done{background:#f1f7e8;color:#4b6d1f}.money{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;color:var(--muted);font-size:.78rem;font-weight:700}.money strong{display:block;color:var(--ink);margin-top:3px}.progress{height:8px;border-radius:999px;background:#ece7de;overflow:hidden}.progress span{display:block;height:100%;width:var(--pct);background:linear-gradient(90deg,var(--brand),var(--accent))}.section{border-top:1px solid var(--line);margin-top:14px;padding-top:14px}.empty{border:1px dashed var(--line);border-radius:8px;padding:22px;text-align:center;color:var(--muted)}table{width:100%;border-collapse:collapse;border:1px solid var(--line);border-radius:8px;overflow:hidden}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:.76rem;text-transform:uppercase;background:#fbfaf8}.receipt{white-space:pre-wrap;background:#fbfaf8;border:1px solid var(--line);border-radius:8px;padding:12px;line-height:1.45}.toast{position:fixed;right:14px;bottom:14px;background:#202124;color:#fff;padding:11px 13px;border-radius:8px;opacity:0;transform:translateY(8px);transition:.18s}.toast.show{opacity:1;transform:none}.hidden{display:none}.footer{text-align:center;color:var(--muted);font-size:.84rem;margin-top:16px}@media(max-width:850px){header{align-items:stretch;flex-direction:column}.grid{grid-template-columns:1fr}}@media(max-width:560px){.app{width:calc(100% - 16px);padding-top:10px}.brand{align-items:flex-start}.brand img{width:54px;height:54px}.actions button,.actions label{flex:1}.stats,.money{grid-template-columns:1fr}.detail-head,.card-head{flex-direction:column}button,label.button{width:100%}.small{width:auto}table,thead,tbody,tr,td,th{display:block}thead{display:none}tr{border-bottom:1px solid var(--line);padding:7px 0}td{border:0;padding:5px 9px}td:before{content:attr(data-label);display:block;color:var(--muted);font-size:.74rem;font-weight:700}}
</style></head>
<body><main class="app"><header><div class="brand"><img src="logo.svg" alt="Logo Hogar de Larry"><div><p class="kicker">Hogar de Larry</p><h1>Control de prestamos y abonos</h1><p class="muted">Registra cuotas, saldos pendientes y recibos para compartir.</p></div></div><div class="actions"><button class="secondary" id="exportBtn">Exportar</button><label class="button secondary" for="importFile">Importar</label><input class="hidden" id="importFile" type="file" accept="application/json"></div></header><section class="grid"><aside class="panel"><div class="tabs"><button class="tab active" data-filter="open">Pendientes</button><button class="tab" data-filter="all">Todas</button><button class="tab" data-filter="paid">Pagadas</button></div><div class="stats"><div class="stat"><span>Total</span><strong id="statTotal">$0</strong></div><div class="stat"><span>Abonado</span><strong id="statPaid">$0</strong></div><div class="stat"><span>Faltante</span><strong id="statRemaining">$0</strong></div></div><form id="debtForm"><label class="field">Persona<input id="personName" required placeholder="Ej. Ana Perez"></label><label class="field">Concepto<input id="concept" required placeholder="Prestamo, producto, mercado"></label><div class="row"><label class="field">Valor total<input id="totalAmount" required type="number" min="0" step="0.01"></label><label class="field">Fecha<input id="debtDate" required type="date"></label></div><label class="field">Nota<textarea id="note"></textarea></label><button>Guardar deuda</button></form><div class="section"><input id="searchInput" placeholder="Buscar persona o concepto"><div class="list" id="debtList"></div></div></aside><section class="panel" id="detailPanel"><div class="empty">Agrega una deuda o selecciona un registro.</div></section></section><p class="footer">Hecha por Lina Rodriguez para el proyecto Hogar de Larry.</p></main><div class="toast" id="toast"></div>
<script>
const KEY='prestamos-y-abonos-v1',fmt=new Intl.NumberFormat('es-CO',{style:'currency',currency:'COP',maximumFractionDigits:0}),state={debts:[],selectedId:null,filter:'open',search:''},$=id=>document.getElementById(id),el={form:$('debtForm'),list:$('debtList'),panel:$('detailPanel'),date:$('debtDate'),toast:$('toast')};function today(){return new Date().toISOString().slice(0,10)}function money(v){return fmt.format(Math.max(Number(v)||0,0))}function shortDate(d){return d?new Date(d+'T00:00:00').toLocaleDateString('es-CO',{year:'numeric',month:'short',day:'numeric'}):''}function uid(){return Date.now()+'-'+Math.random().toString(16).slice(2)}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function totals(d){let paid=d.payments.reduce((s,p)=>s+Number(p.amount||0),0),total=Number(d.total||0),remaining=Math.max(total-paid,0),pct=total?Math.min(paid/total*100,100):0;return{paid,total,remaining,pct,isPaid:remaining<=0}}function save(){localStorage.setItem(KEY,JSON.stringify(state.debts))}function msg(t){el.toast.textContent=t;el.toast.classList.add('show');clearTimeout(msg.t);msg.t=setTimeout(()=>el.toast.classList.remove('show'),2000)}function receipt(d){let t=totals(d),last=d.payments.slice().sort((a,b)=>new Date(b.date)-new Date(a.date))[0],r=['Hogar de Larry','Recibo de abono',`Persona: ${d.person}`,`Concepto: ${d.concept}`,`Valor total: ${money(t.total)}`,`Total abonado: ${money(t.paid)}`,`Saldo pendiente: ${money(t.remaining)}`];if(last)r.push(`Ultimo abono: ${money(last.amount)} el ${shortDate(last.date)}`);r.push(t.isPaid?'Estado: deuda pagada en su totalidad.':`A la fecha ${shortDate(today())}, queda debiendo ${money(t.remaining)}.`);r.push('Gracias por el abono.','Hecha por Lina Rodriguez.');return r.join('\n')}function filtered(){let q=state.search.toLowerCase().trim();return state.debts.filter(d=>{let t=totals(d);if(state.filter==='open'&&t.isPaid)return false;if(state.filter==='paid'&&!t.isPaid)return false;return !q||`${d.person} ${d.concept}`.toLowerCase().includes(q)}).sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt))}function stats(){let s=state.debts.reduce((a,d)=>{let t=totals(d);a.total+=t.total;a.paid+=t.paid;a.remaining+=t.remaining;return a},{total:0,paid:0,remaining:0});$('statTotal').textContent=money(s.total);$('statPaid').textContent=money(s.paid);$('statRemaining').textContent=money(s.remaining)}function renderList(){let rows=filtered();el.list.innerHTML=rows.length?rows.map(d=>{let t=totals(d);return`<article class="card ${d.id===state.selectedId?'active':''}" data-id="${d.id}"><div class="card-head"><div><h3>${esc(d.person)}</h3><p class="muted">${esc(d.concept)} - ${shortDate(d.date)}</p></div><span class="pill ${t.isPaid?'done':''}">${t.isPaid?'Pagada':'Pendiente'}</span></div><div class="progress"><span style="--pct:${t.pct}%"></span></div><div class="money"><span>Total<strong>${money(t.total)}</strong></span><span>Abonado<strong>${money(t.paid)}</strong></span><span>Falta<strong>${money(t.remaining)}</strong></span></div></article>`}).join(''):'<div class="empty">No hay registros.</div>'}function payments(d){return d.payments.length?`<table><thead><tr><th>Fecha</th><th>Abono</th><th>Nota</th><th></th></tr></thead><tbody>${d.payments.slice().sort((a,b)=>new Date(b.date)-new Date(a.date)).map(p=>`<tr><td data-label="Fecha">${shortDate(p.date)}</td><td data-label="Abono">${money(p.amount)}</td><td data-label="Nota">${esc(p.note||'Sin nota')}</td><td data-label="Accion"><button class="danger small" data-action="delete-payment" data-id="${p.id}">Quitar</button></td></tr>`).join('')}</tbody></table>`:'<div class="empty">Todavia no hay abonos.</div>'}function renderDetail(){let d=state.debts.find(x=>x.id===state.selectedId);if(!d){el.panel.innerHTML='<div class="empty">Agrega una deuda o selecciona un registro.</div>';return}let t=totals(d),r=receipt(d);el.panel.innerHTML=`<div class="detail-head"><div><h2>${esc(d.person)}</h2><p class="muted">${esc(d.concept)} - registrado el ${shortDate(d.date)}</p>${d.note?`<p class="muted">${esc(d.note)}</p>`:''}</div><button class="danger small" data-action="delete-debt">Eliminar</button></div><div class="stats"><div class="stat"><span>Valor total</span><strong>${money(t.total)}</strong></div><div class="stat"><span>Total abonado</span><strong>${money(t.paid)}</strong></div><div class="stat"><span>Faltante</span><strong>${money(t.remaining)}</strong></div></div><div class="section"><h3>Registrar abono</h3><form id="paymentForm"><div class="row"><label class="field">Valor<input id="paymentAmount" required type="number" min="0" step="0.01"></label><label class="field">Fecha<input id="paymentDate" required type="date" value="${today()}"></label></div><label class="field">Nota<input id="paymentNote" placeholder="cuota, transferencia, efectivo"></label><button>Agregar abono</button></form></div><div class="section"><h3>Historial</h3>${payments(d)}</div><div class="section"><div class="actions"><button class="secondary small" data-action="copy">Copiar recibo</button><button class="secondary small" data-action="share">Compartir</button></div><div class="receipt">${esc(r)}</div></div>`}function render(){stats();renderList();renderDetail();save()}function load(){try{state.debts=JSON.parse(localStorage.getItem(KEY)||'[]')}catch{state.debts=[]}el.date.value=today();render()}async function copy(t){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(t);let a=document.createElement('textarea');a.value=t;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove()}el.form.addEventListener('submit',e=>{e.preventDefault();let d={id:uid(),person:$('personName').value.trim(),concept:$('concept').value.trim(),total:Number($('totalAmount').value),date:$('debtDate').value,note:$('note').value.trim(),payments:[],createdAt:new Date().toISOString()};if(!d.person||!d.concept||d.total<=0||!d.date)return msg('Revisa los datos.');state.debts.push(d);state.selectedId=d.id;el.form.reset();el.date.value=today();render();msg('Deuda guardada.')});el.list.addEventListener('click',e=>{let c=e.target.closest('.card');if(c){state.selectedId=c.dataset.id;render()}});el.panel.addEventListener('submit',e=>{if(e.target.id!=='paymentForm')return;e.preventDefault();let d=state.debts.find(x=>x.id===state.selectedId),amount=Number($('paymentAmount').value),date=$('paymentDate').value,note=$('paymentNote').value.trim();if(!d||amount<=0||!date)return msg('Revisa el abono.');d.payments.push({id:uid(),amount,date,note});render();msg('Abono agregado.')});el.panel.addEventListener('click',async e=>{let d=state.debts.find(x=>x.id===state.selectedId),a=e.target.dataset.action;if(!d||!a)return;if(a==='delete-debt'&&confirm('Eliminar este registro?')){state.debts=state.debts.filter(x=>x.id!==d.id);state.selectedId=state.debts[0]?.id||null;render()}if(a==='delete-payment'){d.payments=d.payments.filter(p=>p.id!==e.target.dataset.id);render()}if(a==='copy'){await copy(receipt(d));msg('Texto copiado.')}if(a==='share'){let text=receipt(d);navigator.share?await navigator.share({text}):(await copy(text),msg('Texto copiado.'))}});document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{state.filter=b.dataset.filter;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));render()});$('searchInput').oninput=e=>{state.search=e.target.value;renderList()};$('exportBtn').onclick=()=>{let blob=new Blob([JSON.stringify(state.debts,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='prestamos-abonos.json';a.click();URL.revokeObjectURL(url)};$('importFile').onchange=async e=>{let f=e.target.files[0];if(!f)return;try{let data=JSON.parse(await f.text());if(!Array.isArray(data))throw Error();state.debts=data;state.selectedId=data[0]?.id||null;render();msg('Datos importados.')}catch{msg('No se pudo importar.')}e.target.value=''};load();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('service-worker.js').catch(()=>{});
</script></body></html>
